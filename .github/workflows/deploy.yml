name: Deploy to GitHub Pages

# Settings -> Pages -> Source should be "GitHub Actions" (see the deploy job).
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # see "Let GitHub's branch build finish first"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # Public by design (the anon key only works through RLS policies).
          # Set them as repository variables; secrets work too.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
      - name: No Gemini key in the bundle
        # Google API keys start with "AIza". The app never embeds one - the
        # server key lives in Supabase secrets and BYOK keys stay on-device.
        run: |
          if grep -rE 'AIza[0-9A-Za-z_-]{35}' dist/; then
            echo "::error::A Google API key was found in dist/"; exit 1
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # With Pages set to "Deploy from a branch", every push also starts
      # GitHub's own "pages build and deployment", which publishes the raw repo
      # (index.html pointing at /src/main.ts, so no CSS or JS). It used to finish
      # a few seconds after this workflow and win. Wait for it, so this deploy
      # lands last. A no-op once Settings -> Pages -> Source is "GitHub Actions".
      - name: Let GitHub's branch build finish first
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          type=$(gh api "repos/$REPO/pages" --jq .build_type || echo unknown)
          if [ "$type" = workflow ]; then exit 0; fi
          echo "::warning::Pages source is '$type'. Set Settings > Pages > Source to 'GitHub Actions' to stop the duplicate branch build."
          for _ in $(seq 60); do
            running=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&event=dynamic" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length')
            if [ "$running" = 0 ]; then exit 0; fi
            sleep 5
          done
          echo "::warning::The branch build was still running after 5 minutes; deploying anyway."
      - id: deployment
        uses: actions/deploy-pages@v5
