<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backpocket — save what you find</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --ink: #1a2130;
    --ink-soft: #5b6472;
    --ink-faint: #8b93a1;
    --paper: #f6f2ea;
    --paper-raised: #fffdf8;
    --paper-sunk: #efe9dc;
    --line: #ddd4c0;
    --line-soft: #e8e1d1;
    --mustard: #a97a35;
    --mustard-dim: #e4d1ab;
    --sage: #6b7f63;
    --sage-dim: #d9e0d3;
    --danger: #a4453a;
    --focus: #2c5f6f;

    --shadow-card: 0 1px 2px rgba(26,22,14,.04), 0 8px 20px rgba(26,22,14,.05);
    --shadow-modal: 0 24px 70px rgba(20,16,8,.28);
    --dot: rgba(26,22,14,.035);
  }

  :root[data-theme="dark"]{
    --ink: #efe9dd;
    --ink-soft: #b8b0a0;
    --ink-faint: #837c6d;
    --paper: #1b1914;
    --paper-raised: #242119;
    --paper-sunk: #141310;
    --line: #3a3427;
    --line-soft: #2a2620;
    --mustard: #d9a45c;
    --mustard-dim: #4a3a20;
    --sage: #94ab89;
    --sage-dim: #2b3527;
    --danger: #dd8776;
    --focus: #6cb0c9;

    --shadow-card: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.35);
    --shadow-modal: 0 24px 70px rgba(0,0,0,.6);
    --dot: rgba(255,251,240,.04);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 0);
    background-size: 22px 22px;
    transition: background-color .2s ease, color .2s ease;
  }
  ::selection { background: var(--mustard-dim); }
  a { color: inherit; }
  button { font-family: inherit; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  /* ---------- App shell ---------- */
  .app {
    display: grid;
    grid-template-columns: 292px 1fr;
    min-height: 100vh;
  }
  /* ---------- Sidebar ---------- */
  .sidebar {
    background: var(--paper-raised);
    border-right: 1px solid var(--line);
    padding: 26px 18px 18px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: sticky;
    top: 0;
    overflow-y: auto;
  }
  .brand-row { display: flex; align-items: center; gap: 9px; margin-bottom: 3px; }
  .theme-toggle {
    margin-left: auto; width: 30px; height: 30px; flex-shrink: 0;
    border: 1px solid var(--line); background: var(--paper);
    border-radius: 8px; cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-soft);
    transition: border-color .15s ease, color .15s ease, transform .1s ease;
  }
  .theme-toggle:hover { border-color: var(--mustard); color: var(--mustard); }
  .theme-toggle:active { transform: scale(.92); }
  .brand-mark {
    width: 22px; height: 22px;
    border-radius: 4px;
    background: linear-gradient(155deg, var(--mustard), #8f6a35);
    flex-shrink: 0;
    position: relative;
  }
  .brand-mark::after{
    content:'';
    position: absolute; left: 5px; top: 4px; right: 5px; bottom: 5px;
    border-left: 2px solid rgba(255,255,255,.75);
    border-bottom: 2px solid rgba(255,255,255,.75);
    border-radius: 1px;
  }
  .brand { font-family: 'Source Serif 4', serif; font-size: 20px; font-weight: 600; margin: 0; }
  .brand-sub { font-size: 12px; color: var(--ink-faint); margin: 0 0 24px; line-height: 1.55; padding-left: 31px; }

  .tree-label {
    font-size: 11px; color: var(--ink-faint); letter-spacing: .02em;
    margin: 0 0 8px; padding: 0 4px;
  }

  .tree { list-style: none; margin: 0; padding: 0; flex: 1; }
  .tree ul { list-style: none; margin: 1px 0 3px 10px; padding-left: 13px; border-left: 1px solid var(--line-soft); }
  .tree li { margin: 1px 0; }

  .folder-row {
    display: flex; align-items: center; gap: 9px;
    padding: 8px 9px; border-radius: 8px; cursor: pointer;
    font-family: 'Source Serif 4', serif;
    font-size: 14.5px;
    color: var(--ink);
    user-select: none;
    transition: background .15s ease, color .15s ease, transform .12s ease;
  }
  .folder-row:hover { background: var(--paper-sunk); transform: translateX(1px); }
  .folder-row:hover .caret { color: var(--ink-soft); }
  .folder-row.active {
    background: var(--ink); color: var(--paper-raised);
    box-shadow: 0 2px 10px rgba(26,22,14,.18);
  }
  .folder-row.active .folder-icon { box-shadow: 0 0 0 2px rgba(255,255,255,.35); }
  .folder-row.active .caret { color: var(--paper-raised); opacity: .65; }
  .folder-row .count {
    margin-left: auto; font-family: 'Inter', sans-serif; font-size: 11px;
    color: var(--ink-faint); font-variant-numeric: tabular-nums;
  }
  .folder-row.active .count { color: var(--mustard-dim); }

  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .folder-icon {
    width: 13px; height: 10px; flex-shrink: 0; position: relative;
    border-radius: 1px 3px 3px 3px; margin-top: 1px;
    transition: box-shadow .15s ease;
  }
  .folder-icon::before {
    content: ''; position: absolute; left: 0; top: -3px;
    width: 6px; height: 3px; background: inherit;
    border-radius: 2px 2px 0 0;
  }

  .caret {
    width: 10px; height: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s ease, color .15s ease; color: var(--ink-faint); font-size: 9px;
  }
  .caret.rot { transform: rotate(90deg); }
  .caret.hidden { visibility: hidden; }

  .folder-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .new-folder-btn {
    margin-top: 12px; width: 100%; padding: 10px 12px;
    background: transparent; border: 1px dashed var(--line);
    border-radius: 8px; color: var(--ink-soft); font-size: 13px;
    cursor: pointer; text-align: left; font-family: 'Inter', sans-serif;
    transition: border-color .15s ease, color .15s ease;
  }
  .new-folder-btn:hover { border-color: var(--mustard); color: var(--mustard); }

  .storage-note {
    font-size: 11px; color: var(--ink-faint);
    border-top: 1px solid var(--line-soft);
    padding-top: 12px; margin-top: 14px; line-height: 1.5;
  }

  /* ---------- Main ---------- */
  .main { padding: 34px 44px 70px; max-width: 860px; width: 100%; }

  .topbar { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 4px; }
  .menu-btn {
    display: none; align-items: center; justify-content: center;
    width: 40px; height: 40px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--paper-raised);
    cursor: pointer; flex-shrink: 0; font-size: 16px;
    box-shadow: var(--shadow-card);
  }

  .crumb { font-size: 12.5px; color: var(--ink-faint); margin: 0 0 4px; }
  .crumb span { margin: 0 6px; }

  .title-row { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; flex-wrap: wrap; }
  h1.folder-title {
    font-family: 'Source Serif 4', serif; font-size: 32px; font-weight: 600;
    margin: 0; display: flex; align-items: center; gap: 12px;
  }
  h1.folder-title .dot { width: 13px; height: 13px; }

  /* Save box */
  .save-box {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 28px;
    box-shadow: var(--shadow-card);
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .save-box:focus-within {
    border-color: var(--focus);
    box-shadow: 0 1px 2px rgba(26,22,14,.04), 0 12px 28px rgba(44,95,111,.12);
  }
  .save-box.success { border-color: var(--sage); }
  .save-row { display: flex; gap: 10px; }
  .url-field { position: relative; flex: 1; display: flex; align-items: center; }
  .url-field-icon {
    position: absolute; left: 13px; font-size: 13px; opacity: .5;
    pointer-events: none;
  }
  .save-row input[type=text] {
    flex: 1; padding: 12px 14px 12px 36px; border: 1px solid var(--line);
    border-radius: 8px; font-size: 14px; background: var(--paper);
    color: var(--ink); transition: border-color .15s ease, box-shadow .15s ease;
    width: 100%;
  }
  .save-row input[type=text]:focus {
    outline: none; border-color: var(--focus);
    box-shadow: 0 0 0 3px rgba(44,95,111,.13);
  }
  .save-row button {
    padding: 12px 20px; background: var(--ink); color: var(--paper-raised);
    border: none; border-radius: 8px; font-size: 14px; font-weight: 500;
    cursor: pointer; white-space: nowrap; position: relative; overflow: hidden;
    transition: background .15s ease, transform .1s ease;
  }
  .save-row button:hover { background: #2a3446; }
  .save-row button:active { transform: scale(.97); }
  .save-row button.saved { background: var(--sage); }

  .note-input {
    width: 100%; padding: 11px 14px; border: 1px solid var(--line);
    border-radius: 8px; font-size: 13.5px; background: var(--paper);
    color: var(--ink); margin-top: 10px; font-family: inherit;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .note-input:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px rgba(44,95,111,.13); }

  .save-hint-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 11px; }
  .save-hint { font-size: 12px; color: var(--ink-faint); margin: 0; }
  .save-hint strong { color: var(--ink-soft); font-weight: 600; }
  .note-toggle {
    background: none; border: none; color: var(--mustard); font-size: 12px;
    cursor: pointer; padding: 2px 0; white-space: nowrap; flex-shrink: 0;
  }
  .note-toggle:hover { text-decoration: underline; }

  /* List toolbar (search / sort / date range) */
  .list-toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    margin-bottom: 14px;
  }
  .search-field { position: relative; flex: 1 1 180px; min-width: 140px; }
  .search-field .search-icon {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    font-size: 12px; opacity: .5; pointer-events: none;
  }
  .search-field input {
    width: 100%; padding: 8px 10px 8px 30px; border: 1px solid var(--line);
    border-radius: 8px; font-size: 13px; background: var(--paper-raised);
    color: var(--ink); font-family: inherit;
  }
  .list-toolbar select {
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 13px; background: var(--paper-raised); color: var(--ink);
    font-family: inherit; flex: 0 0 auto;
  }
  .date-range { display: flex; align-items: center; gap: 5px; flex: 0 0 auto; }
  .date-range input[type=date] {
    padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 12.5px; background: var(--paper-raised); color: var(--ink);
    font-family: inherit;
  }
  .date-range span { color: var(--ink-faint); font-size: 12px; }
  .date-range .clear-date-btn {
    background: none; border: none; color: var(--ink-faint); cursor: pointer;
    font-size: 13px; padding: 4px 6px; border-radius: 6px;
  }
  .date-range .clear-date-btn:hover { color: var(--danger); background: rgba(164,69,58,0.08); }
  .list-toolbar input:focus, .list-toolbar select:focus {
    outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px rgba(44,95,111,.13);
  }
  .result-count { font-size: 12px; color: var(--ink-faint); margin: -6px 0 12px; }

  /* Links list */
  .links { list-style: none; margin: 0; padding: 0; }
  .link-item {
    display: flex; align-items: flex-start; gap: 13px;
    padding: 13px 12px;
    background: var(--paper-raised);
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    margin-bottom: 8px;
    cursor: pointer;
    user-select: none;
    transition: background .15s ease, border-color .15s ease, transform .1s ease;
    animation: rise .28s ease both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .link-item:hover { border-color: var(--mustard); background: rgba(169,122,53,0.05); }
  .link-item:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .link-item:active { transform: scale(.995); }

  .link-icon {
    width: 36px; height: 36px; border-radius: 8px;
    background: var(--paper-sunk); border: 1px solid var(--line-soft);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0; color: var(--ink-soft);
    margin-top: 1px; overflow: hidden;
  }
  .link-icon img { width: 18px; height: 18px; border-radius: 3px; object-fit: contain; }

  .link-main { flex: 1; min-width: 0; }
  .link-title {
    font-size: 14.5px; text-decoration: none; color: var(--ink);
    display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-weight: 600;
  }
  .link-title:hover { color: var(--mustard); }
  .link-title.is-url { font-weight: 500; color: var(--ink-soft); }
  .link-url-sub {
    font-size: 12px; color: var(--ink-faint); font-family: 'Inter', monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px;
  }
  .link-meta { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
  .platform-pill {
    display: inline-flex; align-items: center;
    padding: 2px 8px; border-radius: 999px;
    font-size: 10.5px; font-weight: 600; letter-spacing: .01em;
    text-transform: uppercase; flex-shrink: 0;
  }
  .link-date { font-size: 11.5px; color: var(--ink-faint); }

  .title-edit-input {
    width: 100%; padding: 6px 9px; border: 1px solid var(--focus);
    border-radius: 6px; font-size: 14px; background: var(--paper);
    color: var(--ink); font-family: inherit;
    box-shadow: 0 0 0 3px rgba(44,95,111,.13);
  }

  .link-actions { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
  .link-edit, .link-del {
    background: none; border: none; color: var(--ink-faint); cursor: pointer;
    font-size: 12.5px; padding: 6px 9px; border-radius: 6px; flex-shrink: 0;
    opacity: 0; transform: translateX(2px);
    transition: opacity .15s ease, color .12s ease, background .12s ease, transform .15s ease;
    margin-top: 1px;
  }
  .link-item:hover .link-edit, .link-item:hover .link-del { opacity: 1; transform: translateX(0); }
  .link-edit:hover { color: var(--focus); background: rgba(44,95,111,0.08); }
  .link-del:hover { color: var(--danger); background: rgba(164,69,58,0.08); }

  /* Empty state */
  .empty {
    padding: 64px 20px 56px;
    text-align: center;
    color: var(--ink-faint);
    border: 1px dashed var(--line);
    border-radius: 12px;
  }
  .empty-glyph {
    width: 46px; height: 46px; margin: 0 auto 18px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    position: relative;
    background: var(--paper-raised);
  }
  .empty-glyph::before, .empty-glyph::after {
    content: '';
    position: absolute; left: 12px; right: 12px;
    height: 1.5px; background: var(--line);
  }
  .empty-glyph::before { top: 16px; }
  .empty-glyph::after { top: 24px; right: 20px; }
  .empty-title {
    font-family: 'Source Serif 4', serif; font-size: 19px; color: var(--ink);
    margin: 0 0 7px;
  }
  .empty p { font-size: 13.5px; margin: 0; line-height: 1.65; max-width: 340px; margin-inline: auto; }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(22,18,12,.42);
    display: none; align-items: center; justify-content: center;
    z-index: 50; padding: 20px; backdrop-filter: blur(2px);
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: var(--paper-raised); border-radius: 14px; padding: 26px;
    width: 100%; max-width: 380px; box-shadow: var(--shadow-modal);
    animation: pop .18s cubic-bezier(.32,.72,0,1);
  }
  @keyframes pop { from { opacity: 0; transform: scale(.96) translateY(6px); } to { opacity: 1; transform: none; } }
  .modal h2 { font-family: 'Source Serif 4', serif; font-size: 20px; margin: 0 0 18px; }
  .modal label { display: block; font-size: 12px; color: var(--ink-faint); margin: 0 0 6px; }
  .modal input, .modal select {
    width: 100%; padding: 11px 13px; border: 1px solid var(--line);
    border-radius: 8px; font-size: 14px; margin-bottom: 16px;
    background: var(--paper); color: var(--ink); font-family: inherit;
    transition: border-color .15s ease;
  }
  .modal input:focus, .modal select:focus { outline: none; border-color: var(--focus); }

  .color-picker { display: flex; gap: 8px; margin-bottom: 18px; }
  .color-swatch {
    width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; transition: transform .1s ease, border-color .12s ease;
  }
  .color-swatch.selected { border-color: var(--ink); transform: scale(1.1); }

  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 2px; }
  .btn-ghost {
    background: none; border: 1px solid var(--line); padding: 10px 17px;
    border-radius: 8px; cursor: pointer; font-size: 13.5px; color: var(--ink-soft);
    transition: background .12s ease;
  }
  .btn-ghost:hover { background: var(--paper-sunk); }
  .btn-primary {
    background: var(--ink); color: var(--paper-raised); border: none;
    padding: 10px 17px; border-radius: 8px; cursor: pointer;
    font-size: 13.5px; font-weight: 500; transition: background .12s ease;
  }
  .btn-primary:hover { background: #2a3446; }

  .toast {
    position: fixed; bottom: 26px; left: 50%;
    transform: translateX(-50%) translateY(14px);
    background: var(--ink); color: var(--paper-raised);
    padding: 12px 22px; border-radius: 9px; font-size: 13.5px;
    opacity: 0; pointer-events: none;
    transition: opacity .22s ease, transform .22s cubic-bezier(.32,.72,0,1);
    z-index: 60; display: flex; align-items: center; gap: 9px;
    box-shadow: 0 12px 30px rgba(0,0,0,.22);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast .check { color: var(--sage-dim); font-size: 14px; }

  /* ---------- Mobile overrides (kept last so they always win the cascade) ---------- */
  @media (max-width: 780px) {
    .app { grid-template-columns: 1fr; }
    .sidebar {
      position: fixed !important; inset: 0 10% 0 0 !important; z-index: 20;
      height: 100vh !important;
      transform: translateX(-100%);
      transition: transform .25s cubic-bezier(.32,.72,0,1);
      box-shadow: 4px 0 32px rgba(0,0,0,.18);
      visibility: hidden;
      padding-top: max(20px, env(safe-area-inset-top));
    }
    .sidebar.open { transform: translateX(0); visibility: visible; }
    .scrim {
      position: fixed; inset: 0; background: rgba(20,16,10,.38);
      z-index: 19; opacity: 0; pointer-events: none; transition: opacity .2s ease;
      backdrop-filter: blur(1px);
    }
    .scrim.show { opacity: 1; pointer-events: auto; }
    .menu-btn { display: inline-flex !important; }

    .main { padding: 14px 16px 60px; }
    .topbar { margin-bottom: 12px; align-items: center; }
    .crumb { display: none; }
    .title-row { margin-bottom: 14px; }
    h1.folder-title { font-size: 22px; }
    h1.folder-title .dot { width: 10px; height: 10px; }
    .save-box { padding: 14px; margin-bottom: 18px; }
    .save-hint-row { flex-wrap: wrap; }
    .link-item { padding: 12px 6px; gap: 11px; }
    .link-icon { width: 32px; height: 32px; }
    .link-icon img { width: 16px; height: 16px; }
  }
</style>
</head>
<body>

<div class="scrim" id="scrim"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand-row">
      <div class="brand-mark"></div>
      <p class="brand">Backpocket</p>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">☾</button>
    </div>
    <p class="brand-sub">Everything you found and meant to come back to.</p>

    <p class="tree-label">FOLDERS</p>
    <ul class="tree" id="tree"></ul>

    <button class="new-folder-btn" id="newFolderTopBtn">+ New folder</button>

    <p class="storage-note">Saved only on this device's browser, in local storage. No account, no sync yet.</p>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Open folders">☰</button>
      <div style="flex:1">
        <p class="crumb" id="crumb"></p>
        <div class="title-row">
          <h1 class="folder-title" id="folderTitle"></h1>
        </div>
      </div>
    </div>

    <div class="save-box" id="saveBox">
      <div class="save-row">
        <div class="url-field">
          <span class="url-field-icon">🔗</span>
          <input type="text" id="urlInput" placeholder="Paste a link here…" />
        </div>
        <button id="saveBtn">Save</button>
      </div>
      <input type="text" id="noteInput" class="note-input" placeholder="Add a note — what's this for? (optional)" style="display:none" />
      <div class="save-hint-row">
        <p class="save-hint">Saving into <strong id="targetFolderName">All saves</strong>.</p>
        <button type="button" class="note-toggle" id="noteToggle">+ Add a note</button>
      </div>
    </div>

    <div class="list-toolbar" id="listToolbar">
      <div class="search-field">
        <span class="search-icon">⌕</span>
        <input type="text" id="searchInput" placeholder="Search title or URL…" />
      </div>
      <select id="sortSelect">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="platform">By platform</option>
      </select>
      <div class="date-range">
        <input type="date" id="dateStart" aria-label="From date" />
        <span>–</span>
        <input type="date" id="dateEnd" aria-label="To date" />
        <button type="button" class="clear-date-btn" id="clearDateBtn" title="Clear date filter">✕</button>
      </div>
    </div>
    <p class="result-count" id="resultCount" style="display:none"></p>

    <ul class="links" id="linksList"></ul>
  </main>
</div>

<div class="modal-backdrop" id="folderModal">
  <div class="modal">
    <h2>New folder</h2>
    <label for="folderName">Name</label>
    <input type="text" id="folderName" placeholder="e.g. Exercise" />
    <label>Color</label>
    <div class="color-picker" id="colorPicker"></div>
    <label for="folderParent">Nested under</label>
    <select id="folderParent"></select>
    <div class="modal-actions">
      <button class="btn-ghost" id="cancelFolderBtn">Cancel</button>
      <button class="btn-primary" id="createFolderBtn">Create</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const STORAGE_KEY = 'backpocket_data_v1';
  const THEME_KEY = 'backpocket_theme';
  const COLORS = ['#a97a35', '#6b7f63', '#2c5f6f', '#a4453a', '#7a5c9e', '#4a5568'];
  const PLATFORM_COLORS = {
    Instagram: '#c1387e', YouTube: '#d1372e', Facebook: '#3266a8',
    TikTok: '#1f9e9e', X: '#33383f', Link: '#8b93a1'
  };
  function platformColor(label){ return PLATFORM_COLORS[label] || PLATFORM_COLORS.Link; }

  const themeToggle = document.getElementById('themeToggle');
  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    themeToggle.textContent = theme === 'dark' ? '☀' : '☾';
  }
  function initTheme(){
    const saved = localStorage.getItem(THEME_KEY);
    const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(theme);
  }
  themeToggle.onclick = () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    localStorage.setItem(THEME_KEY, next);
    applyTheme(next);
  };
  initTheme();

  function uid(){ return Math.random().toString(36).slice(2, 10); }

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        parsed.folders.forEach(f => { if(!f.color) f.color = COLORS[0]; });
        return parsed;
      }
    }catch(e){}
    return {
      folders: [ { id: 'root', name: 'All saves', parentId: null, color: '#4a5568' } ],
      links: []
    };
  }

  function save(data){ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

  let data = load();
  let currentFolderId = 'root';
  let expanded = new Set(['root']);
  let selectedColor = COLORS[0];
  let sortMode = 'newest';
  let searchQuery = '';
  let dateStartVal = '';
  let dateEndVal = '';

  const treeEl = document.getElementById('tree');
  const linksListEl = document.getElementById('linksList');
  const folderTitleEl = document.getElementById('folderTitle');
  const crumbEl = document.getElementById('crumb');
  const targetFolderNameEl = document.getElementById('targetFolderName');
  const urlInput = document.getElementById('urlInput');
  const toastEl = document.getElementById('toast');

  function childrenOf(id){ return data.folders.filter(f => f.parentId === id); }
  function folderById(id){ return data.folders.find(f => f.id === id); }
  function linkCount(folderId){ return data.links.filter(l => l.folderId === folderId).length; }
  function pathOf(id){
    const path = [];
    let f = folderById(id);
    while(f){ path.unshift(f); f = f.parentId ? folderById(f.parentId) : null; }
    return path;
  }

  function showToast(msg, ok){
    toastEl.innerHTML = (ok ? '<span class="check">✓</span>' : '') + '<span>' + msg + '</span>';
    toastEl.classList.add('show');
    setTimeout(()=> toastEl.classList.remove('show'), 1900);
  }

  function detectPlatform(url){
    url = url.toLowerCase();
    if(url.includes('instagram.com')) return { label: 'Instagram', icon: 'IG' };
    if(url.includes('youtube.com') || url.includes('youtu.be')) return { label: 'YouTube', icon: '▶' };
    if(url.includes('facebook.com') || url.includes('fb.watch')) return { label: 'Facebook', icon: 'f' };
    if(url.includes('tiktok.com')) return { label: 'TikTok', icon: '♪' };
    if(url.includes('twitter.com') || url.includes('x.com')) return { label: 'X', icon: '𝕏' };
    return { label: 'Link', icon: '🔗' };
  }

  function renderTree(){
    treeEl.innerHTML = '';
    treeEl.appendChild(buildLevel(null));
  }

  function buildLevel(parentId){
    const ul = document.createElement('ul');
    ul.style.margin = '0'; ul.style.padding = '0'; ul.style.borderLeft = 'none'; ul.style.listStyle = 'none';
    childrenOf(parentId).forEach(folder => ul.appendChild(buildFolderLi(folder)));
    return ul;
  }

  function buildFolderLi(folder){
    const li = document.createElement('li');
    const kids = childrenOf(folder.id);
    const hasKids = kids.length > 0;
    const isOpen = expanded.has(folder.id);

    const row = document.createElement('div');
    row.className = 'folder-row' + (folder.id === currentFolderId ? ' active' : '');

    const caret = document.createElement('span');
    caret.className = 'caret' + (isOpen ? ' rot' : '') + (!hasKids ? ' hidden' : '');
    caret.innerHTML = '▶';
    caret.onclick = (e) => {
      e.stopPropagation();
      if(expanded.has(folder.id)) expanded.delete(folder.id); else expanded.add(folder.id);
      renderTree();
    };

    const icon = document.createElement('span');
    icon.className = 'folder-icon';
    icon.style.background = folder.color || COLORS[0];

    const name = document.createElement('span');
    name.className = 'folder-name';
    name.textContent = folder.name;

    const count = document.createElement('span');
    count.className = 'count';
    count.textContent = linkCount(folder.id) || '';

    row.appendChild(caret);
    row.appendChild(icon);
    row.appendChild(name);
    row.appendChild(count);
    row.onclick = () => {
      currentFolderId = folder.id;
      if(hasKids) expanded.add(folder.id);
      searchQuery = ''; dateStartVal = ''; dateEndVal = '';
      renderAll();
      closeSidebarMobile();
    };

    li.appendChild(row);
    if(hasKids && isOpen) li.appendChild(buildLevel(folder.id));
    return li;
  }

  function renderMain(){
    document.getElementById('searchInput').value = searchQuery;
    document.getElementById('sortSelect').value = sortMode;
    document.getElementById('dateStart').value = dateStartVal;
    document.getElementById('dateEnd').value = dateEndVal;

    const folder = folderById(currentFolderId);
    const path = pathOf(currentFolderId);
    crumbEl.innerHTML = path.length > 1 ? path.map(f => f.name).join(' <span>›</span> ') : '';
    folderTitleEl.innerHTML = '';
    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = folder.color || COLORS[0];
    folderTitleEl.appendChild(dot);
    folderTitleEl.appendChild(document.createTextNode(folder.name));
    targetFolderNameEl.textContent = folder.name;

    const allInFolder = data.links.filter(l => l.folderId === currentFolderId);
    linksListEl.innerHTML = '';

    if(allInFolder.length === 0){
      document.getElementById('listToolbar').style.display = 'none';
      document.getElementById('resultCount').style.display = 'none';
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.innerHTML = `
        <div class="empty-glyph"></div>
        <p class="empty-title">Nothing saved here yet</p>
        <p>Paste a link above, or share one in from Instagram, YouTube, or Facebook. It'll sit here until you're ready for it.</p>
      `;
      linksListEl.appendChild(empty);
      return;
    }
    document.getElementById('listToolbar').style.display = '';

    let links = allInFolder.slice();
    const q = searchQuery.trim().toLowerCase();
    if(q) links = links.filter(l => (l.note && l.note.toLowerCase().includes(q)) || l.url.toLowerCase().includes(q));
    if(dateStartVal){
      const startTs = new Date(dateStartVal + 'T00:00:00').getTime();
      links = links.filter(l => l.savedAt >= startTs);
    }
    if(dateEndVal){
      const endTs = new Date(dateEndVal + 'T23:59:59.999').getTime();
      links = links.filter(l => l.savedAt <= endTs);
    }
    if(sortMode === 'oldest') links.sort((a,b) => a.savedAt - b.savedAt);
    else if(sortMode === 'platform') links.sort((a,b) => a.platform.localeCompare(b.platform) || b.savedAt - a.savedAt);
    else links.sort((a,b) => b.savedAt - a.savedAt);

    const resultCountEl = document.getElementById('resultCount');
    if(q || dateStartVal || dateEndVal){
      resultCountEl.style.display = '';
      resultCountEl.textContent = links.length + (links.length === 1 ? ' result' : ' results');
    } else {
      resultCountEl.style.display = 'none';
    }

    if(links.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.innerHTML = `
        <div class="empty-glyph"></div>
        <p class="empty-title">No matches</p>
        <p>Nothing here fits the current search or date range. Try clearing a filter.</p>
      `;
      linksListEl.appendChild(empty);
      return;
    }

    links.forEach((link, i) => {
      const li = document.createElement('li');
      li.className = 'link-item';
      li.style.animationDelay = (i * 0.02) + 's';
      li.tabIndex = 0;
      li.setAttribute('role', 'link');
      li.setAttribute('aria-label', 'Open ' + (link.note || link.url));

      const openLink = () => window.open(link.url, '_blank', 'noopener,noreferrer');
      li.addEventListener('click', (e) => {
        if(e.target.closest('a, button, input')) return;
        openLink();
      });
      li.addEventListener('keydown', (e) => {
        if(e.target !== li) return;
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openLink(); }
      });

      const icon = document.createElement('div');
      icon.className = 'link-icon';
      const favicon = document.createElement('img');
      favicon.src = 'https://www.google.com/s2/favicons?sz=64&domain_url=' + encodeURIComponent(link.url);
      favicon.alt = '';
      favicon.loading = 'lazy';
      favicon.onerror = () => { icon.textContent = link.icon || '🔗'; };
      icon.appendChild(favicon);

      const main = document.createElement('div');
      main.className = 'link-main';
      renderLinkMain(main, link);

      const meta = document.createElement('div');
      meta.className = 'link-meta';
      const d = new Date(link.savedAt);
      const pill = document.createElement('span');
      pill.className = 'platform-pill';
      pill.textContent = link.platform;
      pill.style.background = platformColor(link.platform) + '22';
      pill.style.color = platformColor(link.platform);
      const dateEl = document.createElement('span');
      dateEl.className = 'link-date';
      dateEl.textContent = 'Saved ' + d.toLocaleDateString(undefined, {month:'short', day:'numeric', year: d.getFullYear() === new Date().getFullYear() ? undefined : 'numeric'});
      meta.appendChild(pill);
      meta.appendChild(dateEl);
      main.appendChild(meta);

      const actions = document.createElement('div');
      actions.className = 'link-actions';

      const edit = document.createElement('button');
      edit.className = 'link-edit';
      edit.textContent = '✎';
      edit.title = 'Edit title';
      edit.setAttribute('aria-label', 'Edit title');
      edit.onclick = () => startEditTitle(link, main);

      const del = document.createElement('button');
      del.className = 'link-del';
      del.textContent = 'Remove';
      del.onclick = () => {
        data.links = data.links.filter(l => l.id !== link.id);
        save(data);
        renderAll();
      };

      actions.appendChild(edit);
      actions.appendChild(del);

      li.appendChild(icon);
      li.appendChild(main);
      li.appendChild(actions);
      linksListEl.appendChild(li);
    });
  }

  function renderLinkMain(main, link){
    main.querySelectorAll('.link-title, .link-url-sub').forEach(el => el.remove());
    const a = document.createElement('a');
    a.className = 'link-title';
    a.href = link.url; a.target = '_blank'; a.rel = 'noopener noreferrer';

    if(link.note){
      a.textContent = link.note;
      const urlLine = document.createElement('div');
      urlLine.className = 'link-url-sub';
      urlLine.textContent = link.url;
      main.insertBefore(urlLine, main.firstChild);
      main.insertBefore(a, urlLine);
    }else{
      a.classList.add('is-url');
      a.textContent = link.url;
      main.insertBefore(a, main.firstChild);
    }
  }

  function startEditTitle(link, main){
    main.querySelectorAll('.link-title, .link-url-sub').forEach(el => el.remove());
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'title-edit-input';
    input.value = link.note || '';
    input.placeholder = 'Add a title…';
    main.insertBefore(input, main.firstChild);
    input.focus();
    input.select();

    let done = false;
    const commit = () => {
      if(done) return; done = true;
      link.note = input.value.trim() || null;
      save(data);
      renderLinkMain(main, link);
    };
    const cancel = () => {
      if(done) return; done = true;
      renderLinkMain(main, link);
    };
    input.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){ e.preventDefault(); commit(); }
      else if(e.key === 'Escape'){ e.preventDefault(); cancel(); }
    });
    input.addEventListener('blur', commit);
  }

  function renderAll(){ renderTree(); renderMain(); }

  const noteInput = document.getElementById('noteInput');
  const noteToggle = document.getElementById('noteToggle');
  const saveBtn = document.getElementById('saveBtn');
  const saveBox = document.getElementById('saveBox');

  noteToggle.onclick = () => {
    const showing = noteInput.style.display !== 'none';
    if(showing){
      noteInput.style.display = 'none'; noteInput.value = ''; noteToggle.textContent = '+ Add a note';
    }else{
      noteInput.style.display = 'block'; noteToggle.textContent = '− Hide note'; noteInput.focus();
    }
  };

  saveBtn.onclick = () => {
    const url = urlInput.value.trim();
    if(!url){ urlInput.focus(); return; }
    let normalized = url;
    if(!/^https?:\/\//i.test(normalized)) normalized = 'https://' + normalized;
    const platform = detectPlatform(normalized);
    const note = noteInput.value.trim();
    data.links.push({
      id: uid(), url: normalized, folderId: currentFolderId,
      platform: platform.label, icon: platform.icon,
      note: note || null, savedAt: Date.now()
    });
    save(data);
    urlInput.value = ''; noteInput.value = '';
    noteInput.style.display = 'none'; noteToggle.textContent = '+ Add a note';

    saveBtn.textContent = 'Saved ✓';
    saveBtn.classList.add('saved');
    saveBox.classList.add('success');
    setTimeout(() => {
      saveBtn.textContent = 'Save'; saveBtn.classList.remove('saved');
      saveBox.classList.remove('success');
    }, 1100);

    renderAll();
    showToast('Saved to ' + folderById(currentFolderId).name, true);
    urlInput.focus();
  };

  urlInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') saveBtn.click(); });
  noteInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') saveBtn.click(); });

  // ---- Sort / search / date filter ----
  const searchInput = document.getElementById('searchInput');
  const sortSelect = document.getElementById('sortSelect');
  const dateStartInput = document.getElementById('dateStart');
  const dateEndInput = document.getElementById('dateEnd');
  const clearDateBtn = document.getElementById('clearDateBtn');

  searchInput.addEventListener('input', () => { searchQuery = searchInput.value; renderMain(); });
  sortSelect.addEventListener('change', () => { sortMode = sortSelect.value; renderMain(); });
  dateStartInput.addEventListener('change', () => { dateStartVal = dateStartInput.value; renderMain(); });
  dateEndInput.addEventListener('change', () => { dateEndVal = dateEndInput.value; renderMain(); });
  clearDateBtn.addEventListener('click', () => {
    dateStartVal = ''; dateEndVal = '';
    dateStartInput.value = ''; dateEndInput.value = '';
    renderMain();
  });

  (function handleIncoming(){
    const params = new URLSearchParams(window.location.search);
    const incoming = params.get('url') || params.get('text');
    if(incoming){
      const match = incoming.match(/https?:\/\/[^\s]+/);
      if(match) urlInput.value = match[0];
      window.history.replaceState({}, '', window.location.pathname);
    }
  })();

  // ---- Folder modal ----
  const folderModal = document.getElementById('folderModal');
  const folderNameInput = document.getElementById('folderName');
  const folderParentSelect = document.getElementById('folderParent');
  const colorPicker = document.getElementById('colorPicker');

  function renderColorPicker(){
    colorPicker.innerHTML = '';
    COLORS.forEach(c => {
      const sw = document.createElement('div');
      sw.className = 'color-swatch' + (c === selectedColor ? ' selected' : '');
      sw.style.background = c;
      sw.onclick = () => { selectedColor = c; renderColorPicker(); };
      colorPicker.appendChild(sw);
    });
  }

  function openFolderModal(){
    folderParentSelect.innerHTML = '';
    data.folders.forEach(f => {
      const opt = document.createElement('option');
      opt.value = f.id;
      opt.textContent = pathOf(f.id).map(p => p.name).join(' › ');
      folderParentSelect.appendChild(opt);
    });
    folderParentSelect.value = currentFolderId;
    folderNameInput.value = '';
    selectedColor = COLORS[Math.floor(Math.random() * COLORS.length)];
    renderColorPicker();
    folderModal.classList.add('show');
    setTimeout(() => folderNameInput.focus(), 50);
  }

  document.getElementById('newFolderTopBtn').onclick = openFolderModal;
  document.getElementById('cancelFolderBtn').onclick = () => folderModal.classList.remove('show');
  folderModal.addEventListener('click', (e) => { if(e.target === folderModal) folderModal.classList.remove('show'); });

  document.getElementById('createFolderBtn').onclick = () => {
    const name = folderNameInput.value.trim();
    if(!name){ folderNameInput.focus(); return; }
    const id = uid();
    data.folders.push({ id, name, parentId: folderParentSelect.value, color: selectedColor });
    expanded.add(folderParentSelect.value);
    save(data);
    currentFolderId = id;
    folderModal.classList.remove('show');
    renderAll();
  };
  folderNameInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') document.getElementById('createFolderBtn').click(); });

  // ---- Mobile sidebar ----
  const sidebar = document.getElementById('sidebar');
  const scrim = document.getElementById('scrim');
  document.getElementById('menuBtn').onclick = () => { sidebar.classList.add('open'); scrim.classList.add('show'); };
  scrim.onclick = closeSidebarMobile;
  function closeSidebarMobile(){ sidebar.classList.remove('open'); scrim.classList.remove('show'); }

  renderAll();
})();
</script>

</body>
</html>
